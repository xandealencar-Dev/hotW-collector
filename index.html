<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="assets/car.logo.png">

  <title>PortableGarage — Carregando...</title>
  <meta name="description" content="Plataforma para catalogação e gerenciamento de coleções de miniaturas.">

  <!-- Fallback: se o JS falhar, redireciona para login em 2s -->
  <meta http-equiv="refresh" content="2;url=pages/login.html">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap">

  <link rel="stylesheet" href="css/style.css">

  <style>
    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: var(--space-6);
      text-align: center;
      padding: var(--space-4);
      font-family: 'Outfit', sans-serif;
    }

    .splash-logo {
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-2xl);
      background: transparent;
      animation: pulse 2s ease-in-out infinite;
    }

    .splash-title {
      font-size: var(--text-3xl);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text-primary);
    }

    .splash-subtitle {
      font-size: var(--text-sm);
      color: var(--text-tertiary);
      margin-top: var(--space-1);
    }

    .splash-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid var(--border-default);
      border-top-color: var(--color-brand-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .splash-status {
      font-size: var(--text-xs);
      color: var(--text-tertiary);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.85; }
    }
  </style>
</head>
<body>

  <div class="splash-logo">
    <img src="assets/car.logo.png" alt="PortableGarage Logo" style="width:64px;height:64px;object-fit:contain;">
  </div>

  <div>
    <h1 class="splash-title">PortableGarage</h1>
  </div>

  <div class="splash-spinner"></div>
  <p class="splash-status" id="splash-status">Iniciando...</p>

<script>
(function() {
  'use strict';

  var statusEl = document.getElementById('splash-status');

  function goTo(url) {
    if (statusEl) statusEl.textContent = 'Redirecionando...';
    window.location.href = url;
  }

  // Aplicar tema salvo antes de qualquer coisa
  try {
    var savedTheme = localStorage.getItem('hw-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
  } catch (e) { /* sem localStorage */ }

  // Verificar sessão de desenvolvimento
  try {
    var loggedIn = sessionStorage.getItem('hw-dev-logged-in') === 'true';
    if (statusEl) statusEl.textContent = loggedIn ? 'Verificando sessão...' : 'Redirecionando para login...';

    setTimeout(function() {
      if (loggedIn) {
        goTo('pages/dashboard.html');
      } else {
        goTo('pages/login.html');
      }
    }, 600);

  } catch (e) {
    // Se sessionStorage falhar, vai para login
    if (statusEl) statusEl.textContent = 'Redirecionando...';
    setTimeout(function() { goTo('pages/login.html'); }, 600);
  }
})();
</script>

</body>
</html>
